<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b1a"/>
      <stop offset="50%" stop-color="#0d1b3d"/>
      <stop offset="100%" stop-color="#1a0a1f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4da6ff"/>
      <stop offset="100%" stop-color="#ff2d55"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <g opacity="0.15">
    <circle cx="200" cy="80" r="120" fill="#4da6ff"/>
    <circle cx="1000" cy="240" r="140" fill="#ff2d55"/>
  </g>
  <text x="600" y="135" text-anchor="middle" font-family="Segoe UI,Arial" font-size="78" font-weight="900" fill="#ffffff" filter="url(#glow)">ANOOP DUBEY</text>
  <text x="600" y="185" text-anchor="middle" font-family="Segoe UI,Arial" font-size="24" fill="#4da6ff">Student · Founder @CodeNova</text>
  <text x="600" y="225" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="#a0a8c0">Code. Create. Repeat.</text>
  <rect x="480" y="255" width="240" height="4" rx="2" fill="url(#accent)"/>
  <g stroke="#4da6ff" stroke-width="1" opacity="0.3">
    <line x1="60" y1="40" x2="60" y2="280"/><line x1="1140" y1="40" x2="1140" y2="280"/>
  </g>
</svg>
