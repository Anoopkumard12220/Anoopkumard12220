    <radialGradient id="r2" cx="0.85" cy="0.7" r="0.5"><stop offset="0" stop-color="#FF3155" stop-opacity="0.3"/><stop offset="1" stop-color="#080A12" stop-opacity="0"/></radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080A12"/><stop offset="0.5" stop-color="#0B1020"/><stop offset="1" stop-color="#080A12"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
