<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="100%" height="100%">
  <defs>
    <linearGradient id="proj_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="50%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#070b16"/>
    </linearGradient>

    <linearGradient id="proj_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>

    <linearGradient id="proj_card_border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <pattern id="proj_dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#247bff" fill-opacity="0.10"/>
    </pattern>

    <style>
      .mono-txt { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      .sans-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="580" rx="16" fill="url(#proj_bg)"/>
  <rect width="900" height="580" rx="16" fill="url(#proj_dots)"/>
  <rect x="0.8" y="0.8" width="898.4" height="578.4" rx="15.2" fill="none" stroke="url(#proj_border)" stroke-width="1.4"/>

  <!-- Section Header -->
  <g transform="translate(50, 42)">
    <text x="0" y="0" fill="#38bdf8" font-size="12" font-weight="700" class="mono-txt" letter-spacing="1.5">// 05 . SHOWCASE &amp; HIGHLIGHTS</text>
    <text x="0" y="24" fill="#ffffff" font-size="22" font-weight="800" class="sans-txt" letter-spacing="-0.3">Featured Projects &amp; Digital Builds</text>
    <rect x="710" y="5" width="90" height="22" rx="11" fill="#0f2942" stroke="#247bff" stroke-width="0.8"/>
    <circle cx="722" cy="16" r="4" fill="#10b981"/>
    <text x="732" y="20" fill="#93c5fd" font-size="10" font-weight="700" class="mono-txt">6 BUILDS</text>
  </g>

  <!-- ============================================================ -->
  <!-- 2x3 PROJECT CARDS GRID -->
  <!-- ============================================================ -->

  <!-- ROW 1 (y=85) -->
  <!-- CARD 1: AKD-FOX (Compiler) -->
  <g transform="translate(50, 85)">
    <rect width="385" height="142" rx="12" fill="#0c1424" stroke="#ff354f" stroke-width="1.2" stroke-opacity="0.6"/>
    <!-- Top Pill -->
    <rect x="18" y="14" width="132" height="20" rx="6" fill="#2d151d"/>
    <text x="26" y="28" fill="#ff354f" font-size="10" font-weight="700" class="mono-txt">COMPILER &amp; LANG</text>
    <rect x="300" y="14" width="68" height="20" rx="6" fill="#1e293b"/>
    <text x="310" y="28" fill="#10b981" font-size="10" font-weight="700" class="mono-txt">LIVE ↗</text>

    <!-- Title -->
    <text x="18" y="58" fill="#ffffff" font-size="17" font-weight="800" class="sans-txt">🦊 AKD-FOX-COMPILER</text>
    <!-- Description -->
    <text x="18" y="78" fill="#cbd5e1" font-size="12" font-weight="400" class="sans-txt">
      <tspan x="18" dy="0">Custom programming language with English-like syntax (.akd).</tspan>
      <tspan x="18" dy="17">Created to simplify web dev syntax; features live online compiler.</tspan>
    </text>
    <!-- Chips -->
    <g transform="translate(18, 110)">
      <rect width="64" height="20" rx="5" fill="#1e293b"/>
      <text x="8" y="14" fill="#f87171" font-size="10" font-weight="600" class="mono-txt">Compiler</text>
      <rect x="70" y="0" width="76" height="20" rx="5" fill="#1e293b"/>
      <text x="78" y="14" fill="#f7df1e" font-size="10" font-weight="600" class="mono-txt">JavaScript</text>
      <rect x="152" y="0" width="84" height="20" rx="5" fill="#1e293b"/>
      <text x="160" y="14" fill="#38bdf8" font-size="10" font-weight="600" class="mono-txt">Vercel Deploy</text>
    </g>
  </g>

  <!-- CARD 2: AURA MUSIC PLAYER -->
  <g transform="translate(465, 85)">
    <rect width="385" height="142" rx="12" fill="#0c1424" stroke="url(#proj_card_border)" stroke-width="1.2"/>
    <rect x="18" y="14" width="115" height="20" rx="6" fill="#0f2942"/>
    <text x="26" y="28" fill="#38bdf8" font-size="10" font-weight="700" class="mono-txt">WEB AUDIO APP</text>
    <rect x="300" y="14" width="68" height="20" rx="6" fill="#1e293b"/>
    <text x="312" y="28" fill="#94a3b8" font-size="10" font-weight="600" class="mono-txt">PUBLIC</text>

    <text x="18" y="58" fill="#ffffff" font-size="17" font-weight="800" class="sans-txt">🎵 AURA-MUSIC-Player</text>
    <text x="18" y="78" fill="#cbd5e1" font-size="12" font-weight="400" class="sans-txt">
      <tspan x="18" dy="0">Modern web audio streaming player with responsive dynamic UI,</tspan>
      <tspan x="18" dy="17">interactive playback controls, playlist queue, and audio visualizer.</tspan>
    </text>
    <g transform="translate(18, 110)">
      <rect width="70" height="20" rx="5" fill="#1e293b"/>
      <text x="8" y="14" fill="#38bdf8" font-size="10" font-weight="600" class="mono-txt">Web Audio</text>
      <rect x="76" y="0" width="54" height="20" rx="5" fill="#1e293b"/>
      <text x="84" y="14" fill="#06b6d4" font-size="10" font-weight="600" class="mono-txt">React</text>
      <rect x="136" y="0" width="66" height="20" rx="5" fill="#1e293b"/>
      <text x="144" y="14" fill="#cbd5e1" font-size="10" font-weight="600" class="mono-txt">Frontend</text>
    </g>
  </g>

  <!-- ROW 2 (y=245) -->
  <!-- CARD 3: AURA STUDIO -->
  <g transform="translate(50, 245)">
    <rect width="385" height="142" rx="12" fill="#0c1424" stroke="url(#proj_card_border)" stroke-width="1.2"/>
    <rect x="18" y="14" width="118" height="20" rx="6" fill="#1c1d3b"/>
    <text x="26" y="28" fill="#c084fc" font-size="10" font-weight="700" class="mono-txt">CREATIVE SUITE</text>
    <rect x="300" y="14" width="68" height="20" rx="6" fill="#1e293b"/>
    <text x="312" y="28" fill="#94a3b8" font-size="10" font-weight="600" class="mono-txt">PUBLIC</text>

    <text x="18" y="58" fill="#ffffff" font-size="17" font-weight="800" class="sans-txt">🎨 Aura-Studio-</text>
    <text x="18" y="78" fill="#cbd5e1" font-size="12" font-weight="400" class="sans-txt">
      <tspan x="18" dy="0">Digital creative studio environment tailored for student builders</tspan>
      <tspan x="18" dy="17">and designers to craft interactive web layouts and visual tools.</tspan>
    </text>
    <g transform="translate(18, 110)">
      <rect width="78" height="20" rx="5" fill="#1e293b"/>
      <text x="8" y="14" fill="#c084fc" font-size="10" font-weight="600" class="mono-txt">UI/UX Suite</text>
      <rect x="84" y="0" width="64" height="20" rx="5" fill="#1e293b"/>
      <text x="92" y="14" fill="#38bdf8" font-size="10" font-weight="600" class="mono-txt">Web Dev</text>
      <rect x="154" y="0" width="70" height="20" rx="5" fill="#1e293b"/>
      <text x="162" y="14" fill="#10b981" font-size="10" font-weight="600" class="mono-txt">Design Lab</text>
    </g>
  </g>

  <!-- CARD 4: CODENOVA COMMUNITY -->
  <g transform="translate(465, 245)">
    <rect width="385" height="142" rx="12" fill="#0c1424" stroke="#247bff" stroke-width="1.2" stroke-opacity="0.6"/>
    <rect x="18" y="14" width="138" height="20" rx="6" fill="#0d2b1f"/>
    <text x="26" y="28" fill="#10b981" font-size="10" font-weight="700" class="mono-txt">STUDENT INITIATIVE</text>
    <rect x="300" y="14" width="68" height="20" rx="6" fill="#1e293b"/>
    <text x="308" y="28" fill="#38bdf8" font-size="10" font-weight="700" class="mono-txt">FOUNDER</text>

    <text x="18" y="58" fill="#ffffff" font-size="17" font-weight="800" class="sans-txt">⚡ CodeNova Community</text>
    <text x="18" y="78" fill="#cbd5e1" font-size="12" font-weight="400" class="sans-txt">
      <tspan x="18" dy="0">Founder @CodeNova: A premier hub for student builders to</tspan>
      <tspan x="18" dy="17">collaborate, learn hands-on tech stacks, and ship real products.</tspan>
    </text>
    <g transform="translate(18, 110)">
      <rect width="90" height="20" rx="5" fill="#1e293b"/>
      <text x="8" y="14" fill="#38bdf8" font-size="10" font-weight="600" class="mono-txt">Student Hub</text>
      <rect x="96" y="0" width="86" height="20" rx="5" fill="#1e293b"/>
      <text x="104" y="14" fill="#10b981" font-size="10" font-weight="600" class="mono-txt">Open Source</text>
      <rect x="188" y="0" width="65" height="20" rx="5" fill="#1e293b"/>
      <text x="196" y="14" fill="#f87171" font-size="10" font-weight="600" class="mono-txt">Mentorship</text>
    </g>
  </g>

  <!-- ROW 3 (y=405) -->
  <!-- CARD 5: GHOSTCHAT -->
  <g transform="translate(50, 405)">
    <rect width="385" height="142" rx="12" fill="#0c1424" stroke="url(#proj_card_border)" stroke-width="1.2"/>
    <rect x="18" y="14" width="138" height="20" rx="6" fill="#0f2942"/>
    <text x="26" y="28" fill="#38bdf8" font-size="10" font-weight="700" class="mono-txt">REALTIME MESSAGING</text>
    <rect x="290" y="14" width="78" height="20" rx="6" fill="#1e293b"/>
    <text x="298" y="28" fill="#fbbf24" font-size="10" font-weight="600" class="mono-txt">PROTOTYPE</text>

    <text x="18" y="58" fill="#ffffff" font-size="17" font-weight="800" class="sans-txt">💬 GhostChat</text>
    <text x="18" y="78" fill="#cbd5e1" font-size="12" font-weight="400" class="sans-txt">
      <tspan x="18" dy="0">Fast, secure private messaging application architecture utilizing</tspan>
      <tspan x="18" dy="17">lightweight real-time web sockets and ephemeral message stores.</tspan>
    </text>
    <g transform="translate(18, 110)">
      <rect width="80" height="20" rx="5" fill="#1e293b"/>
      <text x="8" y="14" fill="#38bdf8" font-size="10" font-weight="600" class="mono-txt">WebSockets</text>
      <rect x="86" y="0" width="64" height="20" rx="5" fill="#1e293b"/>
      <text x="94" y="14" fill="#f59e0b" font-size="10" font-weight="600" class="mono-txt">Firebase</text>
      <rect x="156" y="0" width="60" height="20" rx="5" fill="#1e293b"/>
      <text x="164" y="14" fill="#94a3b8" font-size="10" font-weight="600" class="mono-txt">Security</text>
    </g>
  </g>

  <!-- CARD 6: NEXUS DRIFT -->
  <g transform="translate(465, 405)">
    <rect width="385" height="142" rx="12" fill="#0c1424" stroke="url(#proj_card_border)" stroke-width="1.2"/>
    <rect x="18" y="14" width="138" height="20" rx="6" fill="#2d1d0f"/>
    <text x="26" y="28" fill="#f59e0b" font-size="10" font-weight="700" class="mono-txt">INTERACTIVE 3D WEB</text>
    <rect x="290" y="14" width="78" height="20" rx="6" fill="#1e293b"/>
    <text x="298" y="28" fill="#fbbf24" font-size="10" font-weight="600" class="mono-txt">PROTOTYPE</text>

    <text x="18" y="58" fill="#ffffff" font-size="17" font-weight="800" class="sans-txt">🏎️ Nexus Drift</text>
    <text x="18" y="78" fill="#cbd5e1" font-size="12" font-weight="400" class="sans-txt">
      <tspan x="18" dy="0">High-performance interactive 3D web experience exploring</tspan>
      <tspan x="18" dy="17">Three.js physics simulation, canvas rendering, and WebGL.</tspan>
    </text>
    <g transform="translate(18, 110)">
      <rect width="65" height="20" rx="5" fill="#1e293b"/>
      <text x="8" y="14" fill="#f59e0b" font-size="10" font-weight="600" class="mono-txt">Three.js</text>
      <rect x="71" y="0" width="55" height="20" rx="5" fill="#1e293b"/>
      <text x="79" y="14" fill="#38bdf8" font-size="10" font-weight="600" class="mono-txt">WebGL</text>
      <rect x="132" y="0" width="80" height="20" rx="5" fill="#1e293b"/>
      <text x="140" y="14" fill="#c084fc" font-size="10" font-weight="600" class="mono-txt">Canvas 3D</text>
    </g>
  </g>
</svg>