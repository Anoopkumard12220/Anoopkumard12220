<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="stack_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="50%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#070b16"/>
    </linearGradient>

    <linearGradient id="stack_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>

    <linearGradient id="stack_core_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>

    <radialGradient id="stack_core_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#247bff" stop-opacity="0"/>
    </radialGradient>

    <pattern id="stack_dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#247bff" fill-opacity="0.10"/>
    </pattern>

    <style>
      .mono-txt { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      .sans-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" rx="16" fill="url(#stack_bg)"/>
  <rect width="900" height="480" rx="16" fill="url(#stack_dots)"/>
  <rect x="0.8" y="0.8" width="898.4" height="478.4" rx="15.2" fill="none" stroke="url(#stack_border)" stroke-width="1.4"/>

  <!-- Section Header -->
  <g transform="translate(50, 42)">
    <text x="0" y="0" fill="#38bdf8" font-size="12" font-weight="700" class="mono-txt" letter-spacing="1.5">// 02 . ARCHITECTURE &amp; TOOLKIT</text>
    <text x="0" y="24" fill="#ffffff" font-size="22" font-weight="800" class="sans-txt" letter-spacing="-0.3">Tech Stack &amp; Developer Toolkit</text>
  </g>

  <!-- LEFT VISUAL: THREE TILTED ELLIPTICAL ORBITS -->
  <g transform="translate(0, 0)">
    <circle cx="245" cy="275" r="160" fill="url(#stack_core_glow)"/>

    <!-- ORBIT 3: Outer Cloud & Tools (Tilt -38 deg) -->
    <g transform="rotate(-38 245 275)">
      <ellipse cx="245" cy="275" rx="225" ry="95" fill="none" stroke="#ff354f" stroke-width="1.4" stroke-dasharray="6,8" stroke-opacity="0.45"/>
    </g>

    <!-- ORBIT 2: Middle Frameworks (Tilt +24 deg) -->
    <g transform="rotate(24 245 275)">
      <ellipse cx="245" cy="275" rx="180" ry="80" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-dasharray="5,7" stroke-opacity="0.55"/>
    </g>

    <!-- ORBIT 1: Inner Languages (Tilt -16 deg) -->
    <g transform="rotate(-16 245 275)">
      <ellipse cx="245" cy="275" rx="135" ry="60" fill="none" stroke="#247bff" stroke-width="1.5" stroke-dasharray="4,6" stroke-opacity="0.65"/>
    </g>

    <!-- Center Hub: Dev Core -->
    <circle cx="245" cy="275" r="38" fill="#0b1326" stroke="url(#stack_core_grad)" stroke-width="2.5"/>
    <circle cx="245" cy="275" r="28" fill="#141f38"/>
    <text x="245" y="271" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="800" class="mono-txt">DEV</text>
    <text x="245" y="284" text-anchor="middle" fill="#ff354f" font-size="10" font-weight="800" class="mono-txt">CORE</text>

    <!-- Floating Orbit 1 Nodes -->
    <g transform="translate(132, 240)">
      <rect width="82" height="24" rx="12" fill="#0c172b" stroke="#f7df1e" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#f7df1e"/>
      <text x="22" y="16" fill="#f1f5f9" font-size="11" font-weight="700" class="sans-txt">JavaScript</text>
      <animateTransform attributeName="transform" type="translate" values="132,240; 134,236; 132,240" dur="4s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(295, 290)">
      <rect width="70" height="24" rx="12" fill="#0c172b" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#38bdf8"/>
      <text x="22" y="16" fill="#f1f5f9" font-size="11" font-weight="700" class="sans-txt">Python</text>
      <animateTransform attributeName="transform" type="translate" values="295,290; 293,294; 295,290" dur="4.5s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(210, 205)">
      <rect width="82" height="24" rx="12" fill="#0c172b" stroke="#3b82f6" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#3b82f6"/>
      <text x="22" y="16" fill="#f1f5f9" font-size="11" font-weight="700" class="sans-txt">TypeScript</text>
      <animateTransform attributeName="transform" type="translate" values="210,205; 208,201; 210,205" dur="3.8s" repeatCount="indefinite"/>
    </g>

    <!-- Orbit 2 Nodes -->
    <g transform="translate(90, 310)">
      <rect width="64" height="24" rx="12" fill="#0c172b" stroke="#06b6d4" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#06b6d4"/>
      <text x="22" y="16" fill="#f1f5f9" font-size="11" font-weight="700" class="sans-txt">React</text>
      <animateTransform attributeName="transform" type="translate" values="90,310; 92,314; 90,310" dur="5s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(325, 220)">
      <rect width="70" height="24" rx="12" fill="#0c172b" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#ffffff"/>
      <text x="22" y="16" fill="#f1f5f9" font-size="11" font-weight="700" class="sans-txt">Next.js</text>
      <animateTransform attributeName="transform" type="translate" values="325,220; 327,216; 325,220" dur="4.2s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(195, 345)">
      <rect width="70" height="24" rx="12" fill="#0c172b" stroke="#22c55e" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#22c55e"/>
      <text x="22" y="16" fill="#f1f5f9" font-size="11" font-weight="700" class="sans-txt">Node.js</text>
      <animateTransform attributeName="transform" type="translate" values="195,345; 193,348; 195,345" dur="4.8s" repeatCount="indefinite"/>
    </g>

    <!-- Orbit 3 Nodes -->
    <g transform="translate(55, 185)">
      <rect width="75" height="24" rx="12" fill="#0c172b" stroke="#f59e0b" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#f59e0b"/>
      <text x="22" y="16" fill="#f1f5f9" font-size="11" font-weight="700" class="sans-txt">Firebase</text>
      <animateTransform attributeName="transform" type="translate" values="55,185; 53,182; 55,185" dur="5.2s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(365, 315)">
      <rect width="82" height="24" rx="12" fill="#0c172b" stroke="#10b981" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#10b981"/>
      <text x="22" y="16" fill="#f1f5f9" font-size="11" font-weight="700" class="sans-txt">Supabase</text>
      <animateTransform attributeName="transform" type="translate" values="365,315; 363,319; 365,315" dur="4.6s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(225, 115)">
      <rect width="94" height="24" rx="12" fill="#1c0f18" stroke="#ff354f" stroke-width="1.2"/>
      <circle cx="12" cy="12" r="3.5" fill="#ff354f"/>
      <text x="22" y="16" fill="#ff354f" font-size="11" font-weight="800" class="mono-txt">AKD-FOX</text>
      <animateTransform attributeName="transform" type="translate" values="225,115; 227,118; 225,115" dur="3.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- RIGHT STRUCTURED GROUPED STACK CHIPS -->
  <g transform="translate(485, 80)">
    <!-- CATEGORY 1: LANGUAGES -->
    <g transform="translate(0, 0)">
      <text x="0" y="12" fill="#93c5fd" font-size="11" font-weight="700" class="mono-txt" letter-spacing="1">LANGUAGES &amp; COMPILERS</text>
      <g transform="translate(0, 22)">
        <rect x="0" y="0" width="76" height="26" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
        <text x="10" y="17" fill="#f1f5f9" font-size="11" font-weight="600" class="sans-txt">JavaScript</text>

        <rect x="84" y="0" width="78" height="26" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
        <text x="94" y="17" fill="#f1f5f9" font-size="11" font-weight="600" class="sans-txt">TypeScript</text>

        <rect x="170" y="0" width="60" height="26" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
        <text x="180" y="17" fill="#f1f5f9" font-size="11" font-weight="600" class="sans-txt">Python</text>

        <rect x="238" y="0" width="68" height="26" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
        <text x="248" y="17" fill="#f1f5f9" font-size="11" font-weight="600" class="sans-txt">HTML/CSS</text>

        <!-- Widened .akd Chip -->
        <rect x="314" y="0" width="76" height="26" rx="6" fill="#240c14" stroke="#ff354f" stroke-width="1"/>
        <text x="323" y="17" fill="#ff354f" font-size="11" font-weight="700" class="mono-txt">.akd Lang</text>
      </g>
    </g>

    <!-- CATEGORY 2: FRAMEWORKS -->
    <g transform="translate(0, 78)">
      <text x="0" y="12" fill="#93c5fd" font-size="11" font-weight="700" class="mono-txt" letter-spacing="1">FRAMEWORKS &amp; RUNTIMES</text>
      <g transform="translate(0, 22)">
        <rect x="0" y="0" width="60" height="26" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
        <text x="12" y="17" fill="#38bdf8" font-size="11" font-weight="600" class="sans-txt">React</text>

        <rect x="68" y="0" width="66" height="26" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
        <text x="78" y="17" fill="#f1f5f9" font-size="11" font-weight="600" class="sans-txt">Next.js</text>

        <rect x="142" y="0" width="68" height="26" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
        <text x="152" y="17" fill="#22c55e" font-size="11" font-weight="600" class="sans-txt">Node.js</text>

        <rect x="218" y="0" width="80" height="26" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
        <text x="228" y="17" fill="#c084fc" font-size="11" font-weight="600" class="sans-txt">UI/UX &amp; 3D</text>
      </g>
    </g>

    <!-- CATEGORY 3: BACKEND & CLOUD -->
    <g transform="translate(0, 156)">
      <text x="0" y="12" fill="#93c5fd" font-size="11" font-weight="700" class="mono-txt" letter-spacing="1">BACKEND, CLOUD &amp; HOSTING</text>
      <g transform="translate(0, 22)">
        <rect x="0" y="0" width="70" height="26" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
        <text x="10" y="17" fill="#f59e0b" font-size="11" font-weight="600" class="sans-txt">Firebase</text>

        <rect x="78" y="0" width="76" height="26" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
        <text x="88" y="17" fill="#10b981" font-size="11" font-weight="600" class="sans-txt">Supabase</text>

        <rect x="162" y="0" width="60" height="26" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
        <text x="172" y="17" fill="#f1f5f9" font-size="11" font-weight="600" class="sans-txt">Vercel</text>

        <rect x="230" y="0" width="60" height="26" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
        <text x="240" y="17" fill="#38bdf8" font-size="11" font-weight="600" class="sans-txt">Netlify</text>
      </g>
    </g>

    <!-- CATEGORY 4: DEV TOOLS -->
    <g transform="translate(0, 234)">
      <text x="0" y="12" fill="#93c5fd" font-size="11" font-weight="700" class="mono-txt" letter-spacing="1">DEVELOPER TOOLS &amp; MOBILE DEV</text>
      <g transform="translate(0, 22)">
        <rect x="0" y="0" width="88" height="26" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
        <text x="10" y="17" fill="#f1f5f9" font-size="11" font-weight="600" class="sans-txt">Git &amp; GitHub</text>

        <rect x="96" y="0" width="70" height="26" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
        <text x="106" y="17" fill="#38bdf8" font-size="11" font-weight="600" class="sans-txt">VS Code</text>

        <rect x="174" y="0" width="65" height="26" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
        <text x="184" y="17" fill="#10b981" font-size="11" font-weight="600" class="mono-txt">Termux</text>

        <rect x="247" y="0" width="56" height="26" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
        <text x="256" y="17" fill="#f87171" font-size="11" font-weight="600" class="mono-txt">Acode</text>

        <rect x="311" y="0" width="56" height="26" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
        <text x="320" y="17" fill="#c084fc" font-size="11" font-weight="600" class="sans-txt">Canva</text>
      </g>
    </g>

    <!-- Summary Box -->
    <g transform="translate(0, 310)">
      <rect width="380" height="42" rx="8" fill="#0c172e" stroke="#247bff" stroke-width="1" stroke-opacity="0.3"/>
      <text x="14" y="26" fill="#93c5fd" font-size="12" font-weight="500" class="sans-txt">
        ⚡ Primary focus: Compilers, 3D Web, AI &amp; Community Building
      </text>
    </g>
  </g>
</svg>